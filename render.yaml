# Blueprint Render — mise en ligne de TOUMA en un clic (serveur + PostgreSQL).
#
# Sur https://dashboard.render.com : « New » → « Blueprint » → connecter ce dépôt.
# Render lit ce fichier, crée la base et le service, et demande les valeurs
# marquées « sync: false » (URL publique, compte administrateur…).
#
# Trois choses à savoir avant de cliquer :
#
#   • Le disque persistant n'est pas un confort. Sans lui, les pièces jointes de
#     la messagerie — factures, photos de lots, listes de prix — disparaissent au
#     redéploiement suivant. Deux solutions, une seule à choisir : le disque
#     ci-dessous, ou un stockage compatible S3 (S3_ENDPOINT & co.), auquel cas le
#     disque ne sert plus à rien.
#   • La sonde de santé pointe sur /ready, pas sur /health : /health répond « je
#     suis debout », /ready répond « la base me répond ». Déployer sur la
#     première mettrait en ligne un service incapable de servir une page.
#   • Aucune donnée de démonstration n'est créée. Le premier administrateur naît
#     de ADMIN_EMAIL / ADMIN_PASSWORD, au tout premier démarrage, et seulement si
#     la base est encore vide.

databases:
  - name: touma-db
    databaseName: touma
    user: touma
    plan: basic-256mb # « free » pour essayer (expire après 30 j) ; « basic » en réel

services:
  - type: web
    name: touma
    runtime: docker
    plan: starter # ~7 $/mois, toujours actif
    healthCheckPath: /ready
    autoDeploy: true
    disk:
      name: touma-fichiers
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: touma-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

      # ── Secrets, générés par Render (longs et aléatoires) ──────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOUMA_PAYMENT_WEBHOOK_SECRET
        generateValue: true

      # ── Place de marché ────────────────────────────────────────────────────
      # Corridor pilote Tchad ↔ Cameroun : les deux pays partagent le franc CFA
      # d'Afrique centrale. Aucune conversion entre devises n'est faite tant
      # qu'aucun taux officiel n'est raccordé.
      - key: TOUMA_DEFAULT_CURRENCY
        value: XAF
      # Commission de la place de marché (0.05 = 5 %), ajustable sans redéploiement.
      - key: TOUMA_COMMISSION_RATE
        value: "0.05"
      # Pièces jointes sur le disque persistant monté ci-dessus.
      - key: TOUMA_ATTACHMENT_DIR
        value: /data/touma-attachments

      # Le pilote automatique du logiciel d'automatisation historique reste éteint.
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: AUTOPILOT_RUN_ON_START
        value: "false"
      - key: DEMO_MODE
        value: "false"

      # ── À renseigner dans le tableau de bord Render ────────────────────────
      - key: PUBLIC_URL # ex. https://touma.onrender.com, puis votre domaine
        sync: false
      - key: ADMIN_EMAIL # crée le compte administrateur au 1er démarrage
        sync: false
      - key: ADMIN_PASSWORD # ≥ 10 caractères
        sync: false

      # ── Identité légale portée sur les reçus de paiement ───────────────────
      # Tant qu'elle n'est pas renseignée, le document le dit plutôt que
      # d'inventer une raison sociale ou un numéro d'immatriculation.
      - key: TOUMA_COMPANY_NAME
        sync: false
      - key: TOUMA_COMPANY_LEGAL_NAME
        sync: false
      - key: TOUMA_COMPANY_REGISTRATION_NO
        sync: false
      - key: TOUMA_COMPANY_TAX_ID
        sync: false
      - key: TOUMA_COMPANY_ADDRESS
        sync: false
      - key: TOUMA_COMPANY_COUNTRY
        sync: false
      - key: TOUMA_COMPANY_EMAIL
        sync: false

      # ── Stockage objet compatible S3 (facultatif) ──────────────────────────
      # Renseigné, il remplace le disque local pour les pièces jointes. Le bucket
      # doit rester PRIVÉ : TOUMA lit les fichiers côté serveur et les sert
      # derrière sa propre URL signée, jamais par une URL présignée.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

      # ── Envoi d'e-mails (facultatif) ───────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
