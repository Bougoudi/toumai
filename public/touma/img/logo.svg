<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TOUMA">
  <title>TOUMA</title>
  <defs>
    <linearGradient id="touma-fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7274"/>
      <stop offset="1" stop-color="#063536"/>
    </linearGradient>
    <linearGradient id="touma-soleil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eda06f"/>
      <stop offset="1" stop-color="#e07a3f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#touma-fond)"/>
  <!-- Le soleil se lève : il touche l'horizon, il ne flotte pas au-dessus. -->
  <path d="M15 39a17 17 0 0 1 34 0z" fill="url(#touma-soleil)"/>
  <!-- L'horizon déborde du soleil des deux côtés : la ligne continue au-delà. -->
  <rect x="9" y="39" width="46" height="6.5" rx="3.25" fill="#faf8f2"/>
  <!-- La route qui s'éloigne. Elle s'efface au favicon, et c'est voulu :
       à 16 px il ne doit rester que le soleil et l'horizon. -->
  <rect x="22" y="50" width="20" height="4.5" rx="2.25" fill="#faf8f2" opacity=".55"/>
</svg>
