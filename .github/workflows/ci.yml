# Intégration continue TOUMA.
#
# install → typecheck → tests unitaires → tests d'intégration et de bout en bout
# (PostgreSQL + Redis réels) → build → image Docker.
# Toute étape en échec fait échouer le pipeline.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 : le lanceur de tests intégré n'accepte les motifs glob
  # (« tests/**/*.test.ts ») qu'à partir de cette version.
  NODE_VERSION: '22'

jobs:
  qualite:
    name: Typage & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: touma
          POSTGRES_PASSWORD: touma
          POSTGRES_DB: touma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U touma -d touma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://touma:touma@localhost:5432/touma_test?schema=public
      TEST_DATABASE_URL: postgresql://touma:touma@localhost:5432/touma_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-non-sensible-pour-tests-uniquement-32
      JWT_ACCESS_SECRET: ci-access-secret-non-sensible-pour-tests-32
      JWT_REFRESH_SECRET: ci-refresh-secret-non-sensible-pour-tests-32
      ENCRYPTION_KEY: ci-encryption-key-non-sensible-pour-tests-32
      TOUMA_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-non-sensible-32
      ENABLE_SCHEDULER: 'false'
      AUTOPILOT_RUN_ON_START: 'false'
      DEMO_MODE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci

      - name: Client Prisma
        run: npx prisma generate

      - name: Validation du schéma Prisma
        run: npx prisma validate

      # Le dépôt n'embarque pas d'ESLint : le contrôle de typage strict de
      # TypeScript tient ce rôle et échoue au moindre écart.
      - name: Contrôle de typage
        run: npm run typecheck

      - name: Migrations
        run: npx prisma migrate deploy

      - name: Tests unitaires
        run: npm run test:unit

      - name: Tests d'intégration
        run: npm run test:integration

      - name: Test de bout en bout (parcours complet)
        run: npm run test:e2e

      - name: Vérification du seed
        run: npm run seed

      - name: Build
        run: npm run build

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: touma:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Résumé
        run: echo "Image touma:ci construite avec succès."
