<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Checkout | HavenLume</title>
<meta name="description" content="HavenLume secure checkout.">
<link rel="stylesheet" href="/styles.css">
<script src="/js/common.js" defer></script><script src="/js/checkout.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="checkout">
 <form id="checkoutForm" class="checkout-form" novalidate>
  <p class="eyebrow" id="checkoutEyebrow">SECURE CHECKOUT</p><h1 class="page-title">Shipping details</h1>
  <div class="mode-banner" id="modeBanner" hidden></div>
  <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="120">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
  <label for="phone">Phone <span class="optional">(optional — only shared with the carrier if needed for delivery)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20">
  <label for="address1">Street address</label><input id="address1" name="address1" autocomplete="address-line1" required maxlength="200">
  <label for="address2">Apartment, suite, etc. <span class="optional">(optional)</span></label><input id="address2" name="address2" autocomplete="address-line2" maxlength="200">
  <div class="field-row">
   <div><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required maxlength="100"></div>
   <div><label for="state">State</label><select id="state" name="state" autocomplete="address-level1" required><option value="">Select</option></select></div>
   <div><label for="postalCode">ZIP code</label><input id="postalCode" name="postalCode" autocomplete="postal-code" inputmode="numeric" required maxlength="10" pattern="\d{5}(-\d{4})?"></div>
  </div>
  <label>Country</label><input value="United States" disabled>
  <label class="check"><input type="checkbox" id="agree" required> I agree to the <a href="/terms" target="_blank">Terms of Sale</a> and have read the <a href="/privacy" target="_blank">Privacy Policy</a>.</label>
  <p class="form-error" id="formError" role="alert"></p>
  <button class="button full" type="submit" id="payButton">Continue to secure payment <span>↗</span></button>
  <p class="micro" id="payNote">You will pay by card on iyzico's secure page. We never see or store your card number.</p>
 </form>
 <aside class="summary" aria-label="Order summary">
  <p class="eyebrow">ORDER SUMMARY</p>
  <div id="summaryLines"></div>
  <div class="summary-row"><span>Subtotal</span><span id="subtotal"></span></div>
  <div class="summary-row"><span>Shipping</span><span id="shipping"></span></div>
  <div class="summary-row total"><span>Total</span><span id="total"></span></div>
  <a class="text-link" href="/cart">Edit cart</a>
 </aside>
</section>
</main>
<div id="site-footer"></div>
</body>
</html>
