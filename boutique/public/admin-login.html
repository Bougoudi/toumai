<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HavenLume Admin — Sign in</title>
<link rel="stylesheet" href="/styles.css">
<script src="/js/admin-login.js" defer></script>
</head>
<body class="admin-body">
<main class="admin-wrap login-wrap">
 <div class="admin-card">
  <a class="brand" href="/">HavenLume<span>ADMINISTRATION</span></a>
  <h1 class="admin-h1">Sign in</h1>
  <form id="login" class="admin-form">
   <label for="u">Username</label><input id="u" name="username" autocomplete="username" required>
   <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
   <button class="button full" type="submit">Sign in</button>
   <p id="error" class="form-error" role="alert"></p>
  </form>
 </div>
</main>
</body>
</html>
