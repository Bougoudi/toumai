<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HavenLume Admin</title>
<link rel="stylesheet" href="/styles.css">
<script src="/js/admin.js" defer></script>
</head>
<body class="admin-body">
<header class="admin-top">
 <a class="brand" href="/">HavenLume<span>ORDER DESK</span></a>
 <nav class="admin-tabs" aria-label="Admin">
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="orders">Orders</button>
  <button data-tab="messages">Messages <span class="badge" id="msgBadge" hidden></span></button>
  <button data-tab="settings">Settings</button>
  <button data-tab="activity">Activity</button>
 </nav>
 <div class="admin-actions">
  <button class="admin-btn ghost" id="notifBtn">Alerts <span class="badge" id="notifBadge" hidden></span></button>
  <button class="admin-btn" id="logout">Sign out</button>
 </div>
</header>
<main class="admin-wrap">
 <div id="statusBar"></div>
 <section data-panel="dashboard"><div id="dashboard">Loading…</div></section>
 <section data-panel="orders" hidden>
  <div class="admin-card filters">
   <input id="q" placeholder="Search order, name, email" aria-label="Search">
   <select id="fPayment" aria-label="Payment status"><option value="">All payments</option><option>pending</option><option>paid</option><option>failed</option><option>partially_refunded</option><option>refunded</option></select>
   <select id="fFulfillment" aria-label="Logistics status"><option value="">All logistics</option><option>unfulfilled</option><option>supplier_order_prepared</option><option>supplier_ordered</option><option>shipped</option><option>delivered</option><option>cancelled</option><option>return_requested</option><option>returned</option></select>
   <label class="check"><input type="checkbox" id="fTests"> Show demo orders</label>
  </div>
  <div id="orders"></div>
 </section>
 <section data-panel="messages" hidden><div id="messages"></div></section>
 <section data-panel="settings" hidden><div id="settings"></div></section>
 <section data-panel="activity" hidden><div id="activity"></div></section>
</main>
<div class="drawer" id="drawer" hidden><div class="drawer-backdrop" data-close></div><div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Order details"><button class="admin-btn ghost drawer-close" data-close>Close ✕</button><div id="detail"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
