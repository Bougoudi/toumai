<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HavenLume Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="admin-wrap"><div class="admin-top"><a class="brand" href="/">HavenLume<span>ORDER DESK</span></a><button class="admin-btn" id="logout">Sign out</button></div><div class="admin-card"><p class="eyebrow">OPERATIONS</p><h1 style="font:40px 'Playfair Display',serif">Orders</h1><p class="muted">Only orders whose payment was verified with iyzico's API may be sent to a supplier. Demo orders are unpaid and intentionally blocked.</p><div id="summary"></div></div><div id="orders">Loading orders…</div><div id="detail"></div><p id="message" class="muted"></p></div><script>
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);
async function load(){const r=await fetch("/api/admin/orders");if(r.status===401){location.href="/admin-login.html";return}const rows=await r.json();$("#summary").textContent=`${rows.length} recent orders · Product reference cost $27.24 · supplier shipping $15.00`;if(!rows.length){$("#orders").innerHTML='<div class="admin-card">No orders yet. Demo orders created on the storefront will appear here as UNPAID test records.</div>';return}$("#orders").innerHTML=`<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Total</th><th>Payment</th><th>Fulfillment</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td>${escapeHtml(o.order_number)}</td><td>${new Date(o.created_at).toLocaleDateString()}</td><td>${escapeHtml(o.customer_name)}<br>${escapeHtml(o.customer_email)}</td><td>${money(o.customer_total)}${o.currency&&o.currency!=="USD"?" "+escapeHtml(o.currency):""}</td><td>${escapeHtml(o.payment_status)}</td><td>${escapeHtml(o.fulfillment_status)}</td><td><button class="admin-btn" onclick="showOrder(${o.id})">View</button></td></tr>`).join("")}</tbody></table></div>`}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.showOrder=async id=>{const r=await fetch(`/api/admin/orders/${id}`);if(!r.ok){$("#message").textContent="Unable to load order";return}const o=await r.json();const supplier=`Supplier Order Request\nReference: ${o.order_number}\nProduct: ${o.product_name}\nVariant: ${o.variant}\nQuantity: ${o.quantity}\nRecipient: ${o.customer_name}\nAddress: ${o.address1}${o.address2?`, ${o.address2}`:""}\nCity/State/ZIP: ${o.city}, ${o.state} ${o.postal_code}\nCountry: ${o.country}\nPhone: ${o.customer_phone||"Not provided"}\nPlease confirm stock, shipping charge, dispatch date and tracking availability.`;$("#detail").innerHTML=`<div class="admin-card"><p class="eyebrow">ORDER DETAILS</p><h2 style="font-size:30px">${escapeHtml(o.order_number)}</h2><p><b>Payment:</b> ${escapeHtml(o.payment_status)} · <b>Fulfillment:</b> ${escapeHtml(o.fulfillment_status)}</p><p><b>Ship to</b><br>${escapeHtml(o.customer_name)}<br>${escapeHtml(o.address1)} ${escapeHtml(o.address2||"")}<br>${escapeHtml(o.city)}, ${escapeHtml(o.state)} ${escapeHtml(o.postal_code)}<br>${escapeHtml(o.country)}<br>${escapeHtml(o.customer_email)} · ${escapeHtml(o.customer_phone||"")}</p><p><b>Product:</b> ${escapeHtml(o.product_name)} — ${escapeHtml(o.variant)} × ${o.quantity}</p><p><b>Sales total:</b> ${money(o.customer_total)} · <b>Supplier cost reference:</b> ${money(o.supplier_unit_cost*o.quantity)} · <b>Supplier shipping reference:</b> ${money(o.supplier_shipping*o.quantity)}</p><p><b>Estimated profit before payment/ad/tax/other costs:</b> ${money(o.estimated_profit)}</p>${o.iyzico_token&&o.payment_status!=="paid"?'<button class="admin-btn" id="verifyPayment">Verify payment with iyzico</button>':""}${o.iyzico_payment_id?`<p class="micro">iyzico payment ID: ${escapeHtml(o.iyzico_payment_id)} · paid ${escapeHtml(o.paid_at||"")}</p>`:""}<button class="admin-btn" id="copySupplier">Copy supplier order text</button><p class="micro">Copy is for preparation only. Check the payment status before any real fulfillment.</p><hr><h3>Supplier order</h3><form id="supplierOrder" class="admin-form"><label>Supplier reference</label><input name="reference" placeholder="Supplier order ID" value="${escapeHtml(o.supplier_reference||"")}"><label>Actual product cost (USD)</label><input name="actualProductCost" type="number" step="0.01" min="0" value="${o.actual_product_cost??""}"><label>Actual shipping cost (USD)</label><input name="actualShippingCost" type="number" step="0.01" min="0" value="${o.actual_shipping_cost??""}"><button class="admin-btn">Mark as ordered from supplier</button></form><hr><h3>Tracking</h3><form id="tracking" class="admin-form"><label>Carrier</label><input name="carrier" placeholder="Carrier name"><label>Tracking number</label><input name="trackingNumber" placeholder="Tracking number"><label>Tracking URL (HTTPS)</label><input name="trackingUrl" placeholder="https://..."><button class="admin-btn">Save tracking</button></form><label>Internal notes</label><textarea id="notes" rows="3">${escapeHtml(o.notes||"")}</textarea><button class="admin-btn" id="saveNotes">Save notes</button><h3>History</h3>${(o.events||[]).map(e=>`<p class="micro">${escapeHtml(e.created_at)} — ${escapeHtml(e.event)} ${escapeHtml(e.details||"")}</p>`).join("")}</div>`;$("#copySupplier").onclick=async()=>{try{await navigator.clipboard.writeText(supplier);$("#message").textContent="Supplier text copied. Check payment status and address before sending."}catch{$("#message").textContent=supplier}};$("#tracking").addEventListener("submit",async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const rr=await fetch(`/api/admin/orders/${id}/tracking`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const jj=await rr.json();$("#message").textContent=jj.error||"Tracking saved";if(rr.ok)load()});if($("#verifyPayment"))$("#verifyPayment").onclick=async()=>{const rr=await fetch(`/api/admin/orders/${id}/verify-payment`,{method:"POST"});const jj=await rr.json();$("#message").textContent=jj.error||"Payment verified with iyzico";if(rr.ok){load();showOrder(id)}};$("#supplierOrder").addEventListener("submit",async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const rr=await fetch(`/api/admin/orders/${id}/supplier-order`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const jj=await rr.json();$("#message").textContent=jj.error||"Supplier order saved";if(rr.ok)load()});$("#saveNotes").onclick=async()=>{const rr=await fetch(`/api/admin/orders/${id}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({notes:$("#notes").value})});$("#message").textContent=rr.ok?"Notes saved":"Could not save notes"}};
$("#logout").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST"});location.href="/admin-login.html"};load();
</script></body></html>
